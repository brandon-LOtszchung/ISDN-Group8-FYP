<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFridge — Interactive Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700&display=swap');

:root {
  --p: #FF6B35; --surface: #FFF8F5; --surface-alt: #FFF0E8;
  --text: #2C3E50; --gray: #8E8E93; --gray-light: #F2F2F7;
  --success: #27AE60; --danger: #C0392B; --scan: #F39C12;
  --border: #E0E0E0; --white: #fff;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-btn: 0 4px 12px rgba(255,107,53,0.3);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; gap: 40px;
}

/* ── SIDEBAR ── */
.sidebar {
  color: rgba(255,255,255,0.85); width: 220px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.sidebar h2 { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
.flow-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
  font-size: 13px; font-weight: 500; opacity: 0.45; transition: all 0.2s; cursor: pointer;
}
.flow-item .fi-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; transition: all 0.2s; }
.flow-item.active { background: rgba(255,255,255,0.1); opacity: 1; }
.flow-item.active .fi-dot { background: var(--p); box-shadow: 0 0 6px var(--p); }
.flow-item.done { opacity: 0.7; }
.flow-item.done .fi-dot { background: var(--success); }
.sidebar-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
.hint-box {
  margin-top: 12px; padding: 12px; background: rgba(255,255,255,0.06); border-radius: 10px;
  font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5;
}
.hint-box strong { color: rgba(255,255,255,0.8); }

/* ── PHONE FRAME ── */
.phone-wrap { position: relative; }
.phone {
  width: 390px; height: 844px; background: var(--white); border-radius: 50px;
  overflow: hidden; display: flex; flex-direction: column; position: relative;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.15), 0 0 0 10px #1c1c1e, 0 30px 80px rgba(0,0,0,0.5), 0 0 40px rgba(255,107,53,0.1);
}
.island {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 100;
}

/* ── STATUS BAR ── */
.status {
  height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px; flex-shrink: 0; position: relative; z-index: 5;
}
.status-time { font-size: 16px; font-weight: 700; color: var(--text); }
.status-icons { display: flex; align-items: center; gap: 5px; }
.status-icons svg { fill: var(--text); }

/* ── SCREEN SYSTEM ── */
.screen {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; background: var(--white);
  transition: opacity 0.25s, transform 0.3s;
  opacity: 0; pointer-events: none; transform: translateX(30px);
}
.screen.active { opacity: 1; pointer-events: all; transform: translateX(0); z-index: 10; }

.screen-inner { padding-top: 54px; display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* ── NAVIGATION BAR (detail screen) ── */
.nav {
  height: 44px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative; padding: 0 16px;
  border-bottom: 0.5px solid rgba(0,0,0,0.1);
}
.nav-title { font-size: 17px; font-weight: 600; color: var(--text); }
.nav-back {
  position: absolute; left: 8px; display: flex; align-items: center; gap: 2px;
  color: var(--p); font-size: 17px; font-weight: 500; cursor: pointer;
  background: none; border: none; font-family: inherit; padding: 8px;
}

/* ── TAB NAV BAR (toolbar icons above large title) ── */
.tab-nav {
  height: 44px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px; flex-shrink: 0;
}
.tab-nav-leading, .tab-nav-trailing { display: flex; align-items: center; }
.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border: none; background: none;
  cursor: pointer; border-radius: 8px; color: var(--p);
  transition: background 0.15s;
}
.icon-btn:active { background: rgba(0,0,0,0.05); }
.icon-btn.scan-color { color: var(--scan); }

/* ── LARGE TITLE ── */
.ltitle { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); padding: 0 20px 10px; flex-shrink: 0; }

/* ── SEARCH ── */
.search {
  margin: 0 16px 10px; height: 36px; background: rgba(118,118,128,0.12);
  border-radius: 10px; display: flex; align-items: center; gap: 7px; padding: 0 10px; flex-shrink: 0;
}
.search svg { flex-shrink: 0; opacity: 0.5; }
.search input {
  flex: 1; border: none; background: none; font: 15px/1 'Inter', sans-serif; color: var(--text); outline: none;
}
.search input::placeholder { color: var(--gray); }

/* ── SCROLL ── */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }

/* ── GROUPED LIST ── */
.list-bg { background: var(--gray-light); }
.sec-hdr {
  padding: 20px 20px 6px; font-size: 12px; font-weight: 600; color: var(--gray);
  font-variant: small-caps; background: var(--gray-light);
}
.inset { margin: 0 16px; border-radius: 12px; overflow: hidden; background: var(--white); }
.inset + .sec-hdr { padding-top: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 0.5px solid rgba(0,0,0,0.07); background: var(--white);
  transition: background 0.1s;
}
.row:last-child { border-bottom: none; }
.row:active { background: #f8f8f8; }
.row-em { font-size: 26px; flex-shrink: 0; width: 36px; text-align: center; }
.row-info { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 600; color: var(--text); }
.row-sub { font-size: 13px; color: var(--gray); margin-top: 1px; }
.row-badge { margin-left: auto; font-weight: 700; font-size: 16px; color: var(--p); flex-shrink: 0; }
.list-footer { padding: 8px 0 20px; text-align: center; font-size: 12px; color: var(--gray); }

/* ── BUTTONS ── */
.btn {
  display: block; width: 100%; padding: 16px; border-radius: 14px; border: none;
  font: 600 16px/1 'Inter',sans-serif; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.btn:active:not(:disabled) { opacity: 0.85; transform: scale(0.98); }
.btn-p { background: var(--p); color: #fff; box-shadow: var(--shadow-btn); }
.btn-p:disabled { background: #E0E0E0; color: #aaa; box-shadow: none; cursor: default; }
.btn-scan { background: var(--scan); color: #fff; box-shadow: 0 4px 12px rgba(243,156,18,0.3); }
.btn-ghost { background: none; color: var(--p); font-size: 15px; padding: 12px; box-shadow: none; }
.btn-danger-ghost { background: none; color: var(--danger); font-size: 15px; padding: 12px; box-shadow: none; }

/* ── PILLS ── */
.pill-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.pill-scroller::-webkit-scrollbar { display: none; }
.pill-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  padding: 7px 14px; border-radius: 20px; font: 600 14px/1 'Inter',sans-serif;
  border: 1.5px solid var(--border); background: var(--white); color: var(--text);
  cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; user-select: none;
}
.pill:active { transform: scale(0.95); }
.pill.on { background: var(--p); border-color: var(--p); color: #fff; }

/* ── BUDGET SLIDER ── */
.budget-price { text-align:center; margin-bottom:16px; }
.budget-price .amount { font:800 40px/1 'Inter',sans-serif; transition:color .15s; }
.budget-price .tier   { font:600 14px/1 'Inter',sans-serif; margin-top:6px; transition:color .15s; }
.budget-price .per    { font:400 12px/1 'Inter',sans-serif; color:var(--gray); margin-top:4px; }
.budget-track-wrap { position:relative; height:44px; display:flex; align-items:center; margin:0 2px; }
.budget-track { position:absolute; inset:0; display:flex; align-items:center; pointer-events:none; }
.budget-gradient {
  position:absolute; left:0; right:0; height:6px; border-radius:3px;
  background: linear-gradient(to right,
    #4CAF50 0%, #4CAF50 28.57%,
    #FF9800 28.57%, #FF9800 64.29%,
    #F44336 64.29%, #F44336 100%);
}
.budget-dim {
  position:absolute; right:0; height:6px;
  border-radius:0 3px 3px 0; background:rgba(255,255,255,.6);
  pointer-events:none; transition:width .05s;
}
input.budget-slider {
  -webkit-appearance:none; appearance:none;
  position:relative; z-index:2; width:100%; height:6px;
  background:transparent; outline:none; cursor:pointer;
}
input.budget-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
  border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.22);
  cursor:grab; transition:background .15s, transform .1s;
}
input.budget-slider::-webkit-slider-thumb:active { transform:scale(1.12); cursor:grabbing; }
input.budget-slider::-moz-range-thumb {
  width:26px; height:26px; border-radius:50%;
  border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.22); cursor:grab;
}
.budget-endpoints { display:flex; justify-content:space-between; font:400 11px/1 'Inter',sans-serif; color:var(--gray); margin-top:6px; }

/* ── PROGRESS DOTS ── */
.dots { display: flex; gap: 6px; justify-content: center; padding: 6px 0; flex-shrink: 0; }
.dot { width: 8px; height: 6px; border-radius: 3px; background: var(--border); transition: all 0.35s cubic-bezier(.4,0,.2,1); }
.dot.cur { width: 20px; background: var(--p); }
.dot.done { background: var(--p); }

/* ── RECIPE CARD ── */
.recipe-card {
  background: var(--surface); border-radius: 12px; overflow: hidden;
  box-shadow: var(--shadow-card); margin: 0 16px 12px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.recipe-card:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.card-hero { height: 80px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; font-size: 38px; }
.card-body { padding: 10px 12px 12px; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text); }
.card-sub { font-size: 12px; color: var(--gray); margin-top: 2px; }
.match-track { height: 4px; background: #E0E0E0; border-radius: 2px; margin-top: 8px; overflow: hidden; }
.match-fill { height: 4px; border-radius: 2px; background: var(--success); transition: width 0.6s cubic-bezier(.4,0,.2,1); }

/* ── SEGMENTED ── */
.seg { display: flex; background: rgba(118,118,128,0.12); border-radius: 9px; padding: 2px; }
.seg-btn {
  flex: 1; text-align: center; padding: 8px 0; font: 600 13px/1 'Inter',sans-serif;
  color: var(--gray); border: none; background: none; border-radius: 8px;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.seg-btn.on { background: var(--white); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

/* ── INFO PILLS ── */
.ipill {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
  background: var(--surface-alt); border-radius: 20px; font: 600 12px/1 'Inter',sans-serif; color: var(--text);
}
.ipill.green { background: #E8F8EE; color: var(--success); }
.ipill.red { background: #FDEAEA; color: var(--danger); }

/* ── INGREDIENT ROW ── */
.ing-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 0.5px solid rgba(0,0,0,0.06);
}
.ing-row:last-child { border-bottom: none; }
.ing-icon { display: flex; align-items: center; flex-shrink: 0; }
.ing-name { flex: 1; font-size: 15px; color: var(--text); }
.ing-qty { font-size: 13px; color: var(--gray); }
.ing-tag { font: 700 11px/1 'Inter',sans-serif; padding: 3px 8px; border-radius: 8px; }
.ing-tag.have { background: #E8F8EE; color: var(--success); }
.ing-tag.need { background: #FDEAEA; color: var(--danger); }

/* ── STEP ROW ── */
.step-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--p); color: #fff; font: 700 12px/1 'Inter',sans-serif; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.step-txt { font-size: 15px; line-height: 1.55; color: var(--text); }

/* ── SHOPPING ROW ── */
.shop-row {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  border-bottom: 0.5px solid rgba(0,0,0,0.07); cursor: pointer; background: var(--white);
  transition: background 0.1s;
}
.shop-row:last-child { border-bottom: none; }
.shop-row:active { background: #f8f8f8; }
.shop-check { display: flex; align-items: center; flex-shrink: 0; transition: color 0.2s; }
.shop-info { flex: 1; }
.shop-name { font-size: 16px; font-weight: 500; color: var(--text); transition: all 0.2s; }
.shop-qty { font-size: 13px; color: var(--gray); margin-top: 1px; }
.shop-cost { font: 700 15px/1 'Inter',sans-serif; color: var(--p); flex-shrink: 0; }
.shop-row.bought .shop-name { text-decoration: line-through; color: var(--gray); }
.shop-emoji { width: 36px; height: 36px; border-radius: 8px; background: rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; transition: opacity 0.2s; }
.shop-row.bought .shop-emoji { opacity: 0.4; }

/* ── COST CARD ── */
.cost-card {
  margin: 8px 16px; background: var(--white); border-radius: 12px;
  padding: 16px; box-shadow: var(--shadow-card); display: flex; align-items: center; justify-content: space-between;
}
.cost-lhs .label { font-size: 12px; color: var(--gray); font-weight: 500; }
.cost-lhs .amount { font: 700 26px/1 'Inter',sans-serif; color: var(--p); margin-top: 2px; letter-spacing: -0.5px; }
.cost-rhs { text-align: right; display: flex; flex-direction: column; gap: 3px; }

/* ── EMPTY STATE ── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 8px; padding: 40px; }
.empty-icon { font-size: 52px; opacity: 0.3; }
.empty-title { font: 700 20px/1 'Inter',sans-serif; color: #555; }
.empty-desc { font-size: 14px; color: var(--gray); text-align: center; line-height: 1.5; }

/* ── SCAN PROMPT (inline, matches ScanPromptView) ── */
.scan-prompt {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; gap: 16px; padding: 32px 24px; text-align: center;
}
.scan-prompt-icon { font-size: 60px; line-height: 1; }
.scan-prompt-title { font: 700 22px/1.3 'Inter',sans-serif; color: var(--text); }
.scan-prompt-sub { font-size: 15px; color: var(--gray); line-height: 1.5; max-width: 280px; }
.scan-prompt-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }

/* ── TAB BAR ── */
.tabbar {
  height: 83px; border-top: 0.5px solid rgba(0,0,0,0.12);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding-top: 10px; background: rgba(250,250,250,0.94);
  backdrop-filter: blur(20px); flex-shrink: 0;
}
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: 500 10px/1 'Inter',sans-serif; color: var(--gray); cursor: pointer;
  border: none; background: none; font-family: inherit; padding: 4px 16px; border-radius: 8px;
  transition: color 0.15s;
}
.tab-btn.on { color: var(--p); }

/* ── SHEET ── */
.sheet-wrap {
  position: absolute; inset: 0; z-index: 200;
  display: flex; flex-direction: column; justify-content: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.sheet-wrap.open { opacity: 1; pointer-events: all; }
.sheet-dim { flex: 1; background: rgba(0,0,0,0.4); cursor: pointer; }
.sheet {
  background: var(--white); border-radius: 20px 20px 0 0; padding: 0 24px 34px;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
.sheet-wrap.open .sheet { transform: translateY(0); }
.handle { width: 38px; height: 5px; background: #ddd; border-radius: 3px; margin: 10px auto 20px; }

/* ── ADD ITEM MODAL ── */
.modal-wrap {
  position: absolute; inset: 0; z-index: 300; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-wrap.open { opacity: 1; pointer-events: all; }
.modal-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
.modal {
  position: relative; background: var(--white); width: 100%; border-radius: 20px 20px 0 0;
  padding: 0 20px 34px; z-index: 1;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}
.modal-wrap.open .modal { transform: translateY(0); }

/* ── FORMS ── */
.field {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px;
  font: 16px/1 'Inter',sans-serif; color: var(--text); outline: none; transition: border-color 0.2s;
  background: var(--white);
}
.field:focus { border-color: var(--p); }
.field-label { font: 600 13px/1 'Inter',sans-serif; color: var(--gray); margin-bottom: 6px; display: block; }

/* ── MEMBER ROW ── */
.mem-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.mem-input {
  flex: 1; padding: 12px 14px; border-radius: 10px;
  font: 15px/1 'Inter',sans-serif; color: var(--text); outline: none; transition: border-color 0.2s;
  background: #F2F2F7; border: 1.5px solid transparent;
}
.mem-input:focus { border-color: var(--p); background: var(--white); }
.mem-del { font-size: 22px; color: var(--danger); cursor: pointer; background: none; border: none; padding: 4px 6px; display: flex; align-items: center; }

/* ── SUMMARY ROWS ── */
.sum-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 0; border-bottom: 0.5px solid rgba(0,0,0,0.07);
}
.sum-row:last-child { border-bottom: none; }
.sum-key { font-size: 16px; color: var(--gray); }
.sum-val { font: 700 16px/1 'Inter',sans-serif; color: var(--text); }

/* ── TYPEWRITER ── */
.cursor { border-right: 2px solid var(--text); animation: blink 0.7s steps(1) infinite; }
@keyframes blink { 0%,100%{border-color:var(--text)} 50%{border-color:transparent} }

/* ── TOAST ── */
.toast {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30,30,30,0.92); color: #fff; padding: 10px 18px; border-radius: 20px;
  font: 600 14px/1 'Inter',sans-serif; white-space: nowrap; z-index: 500;
  opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── SECTION LABEL ── */
.sec-label {
  font: 700 12px/1 'Inter',sans-serif; color: var(--gray);
  font-variant: small-caps; padding: 16px 16px 8px;
}

/* ── FAB ── */
.fab {
  position: absolute; bottom: 96px; right: 16px; width: 50px; height: 50px;
  border-radius: 50%; background: var(--p); box-shadow: var(--shadow-btn);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  cursor: pointer; border: none; transition: transform 0.15s; z-index: 5; color: #fff;
}
.fab:active { transform: scale(0.93); }

@media (max-width: 700px) {
  body { padding: 0; }
  .sidebar { display: none; }
  .phone { border-radius: 0; box-shadow: none; width: 100vw; height: 100dvh; }
}

/* ── SWIPE ROW ── */
.swipe-row-wrap {
  position: relative; overflow: hidden;
  border-bottom: 0.5px solid rgba(0,0,0,0.07);
  touch-action: pan-y; /* let browser scroll vertically; script handles horizontal swipe */
}
.swipe-row-wrap:last-child { border-bottom: none; }
.swipe-row-leading {
  position: absolute; left: 0; top: 0; bottom: 0; width: 240px;
  display: flex; align-items: stretch;
}
.swipe-row-trailing {
  position: absolute; right: 0; top: 0; bottom: 0; width: 80px;
  display: flex; align-items: stretch;
}
.swipe-action-btn {
  flex: 1; border: none; cursor: pointer; color: #fff;
  font: 700 11px/1.3 'Inter',sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; user-select: none; -webkit-user-select: none;
}
.swipe-action-btn:active { filter: brightness(0.9); }
.swipe-action-btn svg { flex-shrink: 0; }
.swipe-row-content {
  position: relative; background: var(--white); will-change: transform;
  touch-action: pan-y; /* allow vertical scroll, intercept horizontal */
}
.swipe-row-content.row { border-bottom: none; cursor: default; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2>App Flow</h2>
  <div class="flow-item active" id="fi-onboard"><div class="fi-dot"></div>Onboarding</div>
  <div class="sidebar-divider"></div>
  <div class="flow-item" id="fi-fridge"><div class="fi-dot"></div>Fridge Inventory</div>
  <div class="flow-item" id="fi-plan"><div class="fi-dot"></div>Food Ideas</div>
  <div class="flow-item" id="fi-detail"><div class="fi-dot"></div>Recipe Detail</div>
  <div class="flow-item" id="fi-shop"><div class="fi-dot"></div>Shopping List</div>
  <div class="flow-item" id="fi-profile"><div class="fi-dot"></div>Profile</div>
  <div class="hint-box" id="hint-box">
    <strong>Start here →</strong><br>Enter your family name to begin the setup flow.
  </div>
</div>

<!-- PHONE -->
<div class="phone-wrap">
<div class="phone" id="phone">
  <div class="island"></div>

  <!-- STATUS BAR -->
  <div class="status" id="status-bar" style="position:absolute;top:0;left:0;right:0;z-index:50;">
    <span class="status-time" id="clock">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 4.5a5 5 0 0 1 3.54 1.46L13 4.5A7 7 0 0 0 8 2.5a7 7 0 0 0-5 2l1.46 1.46A5 5 0 0 1 8 4.5zm0 3a2 2 0 0 1 1.42.59L11 6.5A4 4 0 0 0 8 5.5a4 4 0 0 0-3 1l1.58 1.59A2 2 0 0 1 8 7.5zm0 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="currentColor" fill="none" stroke-opacity="0.35"/><rect x="22.5" y="4" width="3" height="5" rx="1.5" fill="currentColor" fill-opacity="0.4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- ════════ ONBOARDING ════════ -->
  <div class="screen active" id="s-onboard">
    <div class="screen-inner" style="padding-bottom:0;">
      <!-- Back button row (matches OnboardingView HStack with chevron.left) -->
      <div style="display:flex;align-items:center;padding:16px 24px 0;flex-shrink:0;min-height:44px;">
        <button id="ob-back" onclick="obBack()" style="display:none;background:none;border:none;cursor:pointer;color:var(--p);padding:4px 0;display:flex;align-items:center;" aria-label="Back">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1 8.5L9 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="dots" id="ob-dots"></div>
      <div class="scroll" style="padding: 0 24px 24px;" id="ob-body"></div>
      <div style="padding: 8px 24px 40px; flex-shrink:0;">
        <button class="btn btn-p" id="ob-btn" onclick="obNext()" disabled>Continue</button>
      </div>
    </div>
  </div>

  <!-- ════════ MAIN (tabs) ════════ -->
  <div class="screen" id="s-main">
    <div class="screen-inner" style="padding-bottom:0;">
      <!-- TAB PANES -->
      <div id="pane-fridge"  style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
      <div id="pane-plan"    style="flex:1;min-height:0;display:none;flex-direction:column;"></div>
      <div id="pane-shop"    style="flex:1;min-height:0;display:none;flex-direction:column;"></div>
      <div id="pane-profile" style="flex:1;min-height:0;display:none;flex-direction:column;"></div>

      <div class="tabbar">
        <button class="tab-btn on" id="tb-0" onclick="goTab(0)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <line x1="5" y1="9" x2="19" y2="9"/>
            <line x1="10" y1="5" x2="10" y2="7"/>
            <line x1="10" y1="13" x2="10" y2="16"/>
          </svg>
          Fridge
        </button>
        <button class="tab-btn" id="tb-1" onclick="goTab(1)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21h6"/>
            <path d="M12 3C8.7 3 6 5.7 6 9c0 2.4 1.3 4.5 3.2 5.7.5.3.8.8.8 1.3V18h4v-2c0-.5.3-1 .8-1.3C16.7 13.5 18 11.4 18 9c0-3.3-2.7-6-6-6z"/>
          </svg>
          Plan
        </button>
        <button class="tab-btn" id="tb-2" onclick="goTab(2)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
          </svg>
          Shopping
        </button>
        <button class="tab-btn" id="tb-3" onclick="goTab(3)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            <circle cx="12" cy="8" r="4"/>
          </svg>
          Profile
        </button>
      </div>
    </div>
  </div>

  <!-- ════════ RECIPE DETAIL ════════ -->
  <div class="screen" id="s-detail">
    <div class="screen-inner" id="detail-inner" style="padding-bottom:0;"></div>
  </div>

  <!-- ════════ MEMBER PROFILE SCREEN ════════ -->
  <div class="screen" id="s-member-profile">
    <div class="screen-inner" id="member-profile-inner" style="padding-bottom:0;"></div>
  </div>

  <!-- ════════ CAMERA SHEET ════════ -->
  <div class="sheet-wrap" id="sheet-camera">
    <div class="sheet-dim" onclick="closeSheet('sheet-camera')"></div>
    <div class="sheet">
      <div class="handle"></div>
      <div style="font:600 17px/1 Inter,sans-serif;text-align:center;margin-bottom:20px;">Add Items</div>
      <button class="btn btn-scan" style="margin-bottom:12px;" onclick="simulateScan()">Take Photo</button>
      <button class="btn btn-p"    style="margin-bottom:4px;"  onclick="simulateScan()">Choose from Library</button>
      <button class="btn btn-ghost" onclick="closeSheet('sheet-camera')">Cancel</button>
    </div>
  </div>

  <!-- ════════ DELETE CONFIRM SHEET ════════ -->
  <div class="sheet-wrap" id="sheet-delete-confirm">
    <div class="sheet-dim" onclick="cancelDeleteItem()"></div>
    <div class="sheet">
      <div class="handle"></div>
      <div style="text-align:center;padding-bottom:20px;">
        <div id="delete-confirm-title" style="font:600 17px/1.4 Inter,sans-serif;color:var(--text);margin-bottom:6px;"></div>
        <div style="font:15px/1.4 Inter,sans-serif;color:var(--gray)">This will remove the item from your fridge.</div>
      </div>
      <button class="btn" style="background:#FF3B30;color:#fff;box-shadow:0 4px 12px rgba(255,59,48,0.3);margin-bottom:10px" onclick="confirmDeleteItem()">Delete</button>
      <button class="btn btn-ghost" onclick="cancelDeleteItem()">Cancel</button>
    </div>
  </div>

  <!-- ════════ ADD ITEM MODAL ════════ -->
  <div class="modal-wrap" id="modal-add">
    <div class="modal-dim" onclick="closeModal()"></div>
    <div class="modal">
      <div class="handle"></div>
      <div id="modal-add-title" style="font:600 17px/1 Inter,sans-serif;text-align:center;margin-bottom:20px;">Add Item</div>
      <div style="margin-bottom:14px;">
        <label class="field-label">Item Name</label>
        <input class="field" id="add-name" placeholder="e.g. Tofu" autocomplete="off">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
        <div>
          <label class="field-label">Category</label>
          <select class="field" id="add-cat" style="appearance:none;">
            <option>Protein</option><option>Vegetable</option><option>Fruit</option>
            <option>Dairy</option><option>Grain</option><option>Condiment</option>
            <option>Beverage</option><option>Other</option>
          </select>
        </div>
        <div>
          <label class="field-label">Quantity</label>
          <input class="field" id="add-qty" type="number" min="0" value="1">
        </div>
      </div>
      <button class="btn btn-p" id="modal-save-btn" onclick="addItemManually()">Add to Fridge</button>
      <button class="btn btn-ghost" onclick="closeModal()" style="margin-top:4px">Cancel</button>
    </div>
  </div>

  <!-- ════════ ADD MEMBER SHEET ════════ -->
  <div class="sheet-wrap" id="sheet-add-member">
    <div class="sheet-dim" onclick="closeAddMemberSheet()"></div>
    <div class="sheet" style="max-height:82%;overflow:hidden;display:flex;flex-direction:column;padding-left:0;padding-right:0;padding-bottom:0;">
      <div class="handle"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;flex-shrink:0;">
        <button onclick="closeAddMemberSheet()" style="background:none;border:none;cursor:pointer;color:var(--p);font:16px/1 Inter,sans-serif;padding:4px 0;">Cancel</button>
        <span style="font:600 17px/1 Inter,sans-serif;">New Member</span>
        <button id="am-save-btn" onclick="submitAddMember()" disabled style="background:none;border:none;cursor:pointer;color:var(--p);font:600 16px/1 Inter,sans-serif;padding:4px 0;opacity:0.4;transition:opacity 0.15s;">Save</button>
      </div>
      <div class="scroll list-bg" id="add-member-body" style="flex:1;padding-bottom:34px;"></div>
    </div>
  </div>

  <!-- ════════ DELETE MEMBER CONFIRM SHEET ════════ -->
  <div class="sheet-wrap" id="sheet-delete-member">
    <div class="sheet-dim" onclick="cancelDeleteMember()"></div>
    <div class="sheet">
      <div class="handle"></div>
      <div style="text-align:center;padding-bottom:20px;">
        <div id="delete-member-name" style="font:600 17px/1.4 Inter,sans-serif;color:var(--text);margin-bottom:6px;"></div>
        <div style="font:15px/1.4 Inter,sans-serif;color:var(--gray)">This member and their preferences will be permanently removed.</div>
      </div>
      <button class="btn" style="background:#FF3B30;color:#fff;box-shadow:0 4px 12px rgba(255,59,48,0.3);margin-bottom:10px" onclick="confirmDeleteMember()">Delete</button>
      <button class="btn btn-ghost" onclick="cancelDeleteMember()">Cancel</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

</div><!-- /phone -->
</div><!-- /phone-wrap -->

function budgetTier(amount) {
  if (amount < 50)  return {value:'low',    label:'Budget-Friendly', color:'#4CAF50'};
  if (amount < 100) return {value:'medium', label:'Moderate',        color:'#FF9800'};
  return              {value:'high',   label:'Premium',         color:'#F44336'};
}

// Sync slider UI after every drag event
function onBudgetInput(el) {
  S.budget = parseInt(el.value, 10);
  const tier = budgetTier(S.budget);
  const MIN = 10, MAX = 150;
  const pct  = (S.budget - MIN) / (MAX - MIN);
  // dim overlay
  document.getElementById('budget-dim').style.width = (1 - pct) * 100 + '%';
  // thumb colour (inject dynamic rule)
  let st = document.getElementById('budget-thumb-style');
  if (!st) { st = document.createElement('style'); st.id='budget-thumb-style'; document.head.appendChild(st); }
  st.textContent = `input.budget-slider::-webkit-slider-thumb{background:${tier.color}}input.budget-slider::-moz-range-thumb{background:${tier.color}}`;
  // price display
  document.getElementById('budget-amount').textContent = 'HK$' + S.budget;
  document.getElementById('budget-amount').style.color = tier.color;
  document.getElementById('budget-tier').textContent   = tier.label;
  document.getElementById('budget-tier').style.color   = tier.color;
}

const HINTS = {
  'fi-profile':  '<strong>Profile tab:</strong> View family info and tap a member to edit their dietary restrictions, allergies, and preferences.',
  'fi-onboard': '<strong>Step 1:</strong> Set up your family profile — name, cooking level, budget, and members.',
  'fi-fridge':  '<strong>Fridge tab:</strong> Scan or tap + to add items. Tap ⋯ on a row to stock, use, edit, or delete.',
  'fi-plan':    '<strong>Plan tab:</strong> Pick who you\'re cooking for and a cuisine, then get AI recipe ideas.',
  'fi-detail':  '<strong>Recipe Detail:</strong> View ingredients (with fridge matches) and step-by-step instructions.',
  'fi-shop':    '<strong>Shopping tab:</strong> Missing ingredients land here. Share, swipe to delete, or tap to mark as purchased.',
};
function setFlow(id) {
  document.querySelectorAll('.flow-item').forEach(el => {
    el.classList.remove('active');
    if (el.id !== id) el.classList.add('done');
  });
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); el.classList.remove('done'); }
  const hint = document.getElementById('hint-box');
  if (hint) hint.innerHTML = HINTS[id] || '';
}

//  ONBOARDING
// ══════════════════════════════════
const OB = [
  {type:'name'},
  {type:'tw', emoji:'🍳', text:"Let's talk about how your family cooks."},
  {type:'cooking'},
  {type:'tw', emoji:'⭐', textFn:() => ({
    beginner: "No worries — we'll keep the recipes simple and easy to follow.",
    intermediate: "Nice! You'll have plenty of variety to choose from.",
    advanced: "Impressive! Get ready for some complex and exciting dishes.",
  }[S.skill] || 'Great choice!')},
  {type:'budget'},
  {type:'tw', emoji:'💰', text:"Great! We'll find recipes that fit your budget."},
  {type:'members'},
  {type:'summary'},
];

let twT = null;
function renderOB() {
  const step = OB[S.obStep];
  document.getElementById('ob-dots').innerHTML = OB.map((_,i) =>
    `<div class="dot ${i < S.obStep?'done':''} ${i===S.obStep?'cur':''}"></div>`).join('');

  if (twT) { clearTimeout(twT); twT = null; }
  const body = document.getElementById('ob-body');
  const btn  = document.getElementById('ob-btn');
  btn.textContent = S.obStep === OB.length-1 ? 'Get Started' : 'Continue';

  switch (step.type) {
    case 'name':
      body.innerHTML = `
        <div style="padding-top:20px">
          <div style="font-size:52px;line-height:1">👨‍👩‍👧‍👦</div>
          <div style="font:700 28px/1.25 Inter,sans-serif;margin-top:18px;letter-spacing:-0.4px">${'What\'s your family name?'}</div>
          <input class="field" id="fname" placeholder="e.g. The Chan Family" value="${S.familyName}" style="margin-top:20px" autocomplete="off">
        </div>`;
      setTimeout(() => {
        const inp = document.getElementById('fname');
        inp.addEventListener('input', e => { S.familyName = e.target.value; updateOBBtn(); });
        inp.focus();
      }, 50);
      break;

    case 'tw':
      const txt = step.textFn ? step.textFn() : step.text;
      body.innerHTML = `
        <div style="padding-top:20px">
          <div style="font-size:52px;line-height:1">${step.emoji}</div>
          <div style="font:700 22px/1.4 Inter,sans-serif;margin-top:18px;min-height:62px" id="tw"></div>
        </div>`;
      typewrite(txt);
      break;

    case 'cooking':
      body.innerHTML = `
        <div style="padding-top:20px">
          <div style="font-size:52px;line-height:1">🍽️</div>
          <div style="font:700 28px/1.25 Inter,sans-serif;margin-top:18px;letter-spacing:-0.4px">What's your cooking skill level?</div>
          <div class="pill-wrap" style="margin-top:20px" id="skill-pills"></div>
        </div>`;
      SKILLS.forEach(s => {
        const p = mkPill(s.charAt(0).toUpperCase()+s.slice(1), S.skill===s, ()=>{S.skill=s;renderOB();});
        document.getElementById('skill-pills').appendChild(p);
      });
      break;

    case 'budget': {
      const MIN = 10, MAX = 150;
      const tier0 = budgetTier(S.budget);
      const pct0  = (S.budget - MIN) / (MAX - MIN);
      body.innerHTML = `
        <div style="padding-top:20px">
          <div style="font-size:52px;line-height:1">💵</div>
          <div style="font:700 28px/1.25 Inter,sans-serif;margin-top:18px;letter-spacing:-0.4px">What's your budget per person?</div>
          <div style="margin-top:24px">
            <div class="budget-price">
              <div class="amount" id="budget-amount" style="color:${tier0.color}">HK$${S.budget}</div>
              <div class="tier"   id="budget-tier"   style="color:${tier0.color}">${tier0.label}</div>
              <div class="per">per person</div>
            </div>
            <div class="budget-track-wrap">
              <div class="budget-track">
                <div class="budget-gradient"></div>
                <div class="budget-dim" id="budget-dim" style="width:${(1-pct0)*100}%"></div>
              </div>
              <input class="budget-slider" type="range" min="${MIN}" max="${MAX}" step="5"
                     value="${S.budget}" oninput="onBudgetInput(this)">
            </div>
            <div class="budget-endpoints"><span>&lt;HK$${MIN}</span><span>&gt;HK$${MAX}</span></div>
          </div>
        </div>`;
      // inject initial thumb colour
      let st = document.getElementById('budget-thumb-style');
      if (!st) { st = document.createElement('style'); st.id='budget-thumb-style'; document.head.appendChild(st); }
      st.textContent = `input.budget-slider::-webkit-slider-thumb{background:${tier0.color}}input.budget-slider::-moz-range-thumb{background:${tier0.color}}`;
      break;
    }

    case 'members':
      body.innerHTML = `
        <div style="padding-top:20px">
          <div style="font-size:52px;line-height:1">👥</div>
          <div style="font:700 28px/1.25 Inter,sans-serif;margin-top:18px;letter-spacing:-0.4px">Who's in your family?</div>
          <div style="font-size:15px;color:var(--gray);margin-top:8px;line-height:1.5">Dietary preferences and allergies can be set for each member in their profile after setup.</div>
          <div id="mem-list" style="margin-top:20px"></div>
          <button class="btn btn-ghost" style="text-align:left;padding-left:0;margin-top:4px;color:var(--p)" onclick="addMember()">Add Member</button>
        </div>`;
      renderMembers();
      break;

    case 'summary':
      const bl = budgetTier(S.budget).label;
      body.innerHTML = `
        <div style="padding-top:20px">
          <div style="font-size:52px;line-height:1">🎉</div>
          <div style="font:700 28px/1.25 Inter,sans-serif;margin-top:18px;letter-spacing:-0.4px">You're all set!</div>
          <div style="margin-top:20px;background:var(--gray-light);border-radius:12px;padding:4px 16px">
            <div class="sum-row"><span class="sum-key">Family</span><span class="sum-val">${S.familyName}</span></div>
            <div class="sum-row"><span class="sum-key">Cooking skill</span><span class="sum-val">${S.skill.charAt(0).toUpperCase()+S.skill.slice(1)}</span></div>
            <div class="sum-row"><span class="sum-key">Budget</span><span class="sum-val">${bl}</span></div>
            <div class="sum-row"><span class="sum-key">Members</span><span class="sum-val">${S.members.length} people</span></div>
          </div>
        </div>`;
      break;
  }
  updateOBBtn();
}

function mkPill(label, on, fn) {
  const el = document.createElement('span');
  el.className = 'pill' + (on?' on':'');
  el.textContent = label;
  el.onclick = fn;
  return el;
}

function typewrite(text) {
  const el = document.getElementById('tw');
  let i = 0;
  function tick() {
    if (!el) return;
    if (i <= text.length) {
      el.innerHTML = text.slice(0,i) + (i<text.length?'<span class="cursor">&nbsp;</span>':'');
      i++;
      twT = setTimeout(tick, 28);
    } else {
      twT = null;
      updateOBBtn();
    }
  }
  tick();
}

function obBack() {
  if (S.obStep > 0) {
    S.obStep--;
    renderOB();
  }
}

function updateOBBtn() {
  const btn = document.getElementById('ob-btn');
  // Show/hide back button — hidden on first step (matches iOS chevron.left visibility)
  const backBtn = document.getElementById('ob-back');
  if (backBtn) backBtn.style.display = S.obStep > 0 ? 'flex' : 'none';
  const step = OB[S.obStep];
  const ok = {
    name: S.familyName.trim().length > 0,
    tw: twT === null,
    cooking: S.skill !== '',
    budget: true,
    members: true,
    summary: true,
  }[step.type] ?? true;
  btn.disabled = !ok;
}

function obNext() {
  if (S.obStep < OB.length - 1) {
    S.obStep++;
    renderOB();
  } else {
    // Done — launch app; show inline scan prompt in fridge tab
    S.selectedMembers = new Set(S.members);
    goScreen('s-main');
    setFlow('fi-fridge');
    renderFridge(); // renders inline scan prompt since fridgeInitialized=false
    renderPlan();
    renderShop();
  }
}

function renderMembers() {
  const el = document.getElementById('mem-list');
  if (!el) return;
  el.innerHTML = S.members.map((m,i) => `
    <div class="mem-row">
      <input class="mem-input" value="${m}" placeholder="Name"
             oninput="S.members[${i}]=this.value" autocomplete="off">
      <button class="mem-del" onclick="S.members.splice(${i},1);renderMembers()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
      </button>
    </div>`).join('');
}

function addMember() {
  S.members.push('');
  renderMembers();
  const inputs = document.querySelectorAll('.mem-input');
  if (inputs.length) inputs[inputs.length-1].focus();
}

const PANES = ['pane-fridge','pane-plan','pane-shop','pane-profile'];

function goTab(i) {
  S.activeTab = i;
  PANES.forEach((id,j) => {
    document.getElementById(id).style.display = j===i ? 'flex' : 'none';

// ══════════════════════════════════
//  FRIDGE
// ══════════════════════════════════
function renderFridge() {
  openSwipeId = null; openSwipeDir = null;
  const el = document.getElementById('pane-fridge');

  // ── Inline scan prompt (matches ScanPromptView) ──
  if (!S.fridgeInitialized && S.inventory.length === 0) {
    el.innerHTML = `
      <div class="tab-nav">
        ${TAB_NAV_LEADING}
        <div class="tab-nav-trailing">
          <button class="icon-btn" onclick="openModal()" title="Add item">${IC.plus}</button>
          <button class="icon-btn scan-color" onclick="openSheet('sheet-camera')" title="Scan fridge">${IC.camera}</button>
        </div>
      </div>
      <div class="ltitle">My Fridge</div>
      <div class="scan-prompt">
        <div class="scan-prompt-icon">📷</div>
        <div class="scan-prompt-title">Set up your fridge</div>
        <div class="scan-prompt-sub">Scan your fridge or mark it as empty to get started</div>
        <div class="scan-prompt-actions">
          <button class="btn btn-scan" onclick="doScan()">Scan My Fridge</button>
          <button class="btn btn-ghost" onclick="skipScan()">My Fridge is Empty</button>
        </div>
      </div>`;
    return;
  }

  const inv = S.searchText
    ? S.inventory.filter(x => x.name.toLowerCase().includes(S.searchText.toLowerCase()))
    : S.inventory;

  const groups = {};
  inv.forEach(x => (groups[x.cat] = groups[x.cat]||[]).push(x));

  let h = `
    <div class="tab-nav">
      ${TAB_NAV_LEADING}
      <div class="tab-nav-trailing">
        <button class="icon-btn" onclick="openModal()" title="Add item">${IC.plus}</button>
        <button class="icon-btn scan-color" onclick="openSheet('sheet-camera')" title="Scan fridge">${IC.camera}</button>
      </div>
    </div>
    <div class="ltitle">My Fridge</div>
    <div class="search" style="flex-shrink:0">
      <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="5" stroke="currentColor" fill="none" stroke-width="1.5"/><line x1="10" y1="10" x2="13.5" y2="13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input placeholder="Search ingredients..." value="${S.searchText}" oninput="S.searchText=this.value;renderFridge()">
    </div>`;

  if (S.inventory.length === 0) {
    // Fridge initialized but empty
    h += `<div class="empty" style="flex:1">
      <div class="empty-icon">🧊</div>
      <div class="empty-title">Your fridge is empty</div>
      <div class="empty-desc">Tap the camera icon to scan your fridge.</div>
    </div>`;
  } else if (inv.length === 0) {
    h += `<div class="empty" style="flex:1">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No results</div>
      <div class="empty-desc">No items match "${S.searchText}"</div>
    </div>`;
  } else {
    h += `<div class="scroll list-bg" style="padding-bottom:80px">`;
    Object.keys(groups).sort().forEach(cat => {
      h += `<div class="sec-hdr">${cat}</div><div class="inset">`;
      groups[cat].forEach(item => {
        const useDisabled = item.qty <= 0 ? 'disabled style="opacity:0.4;cursor:not-allowed"' : '';
        h += `
        <div class="swipe-row-wrap" data-swipe-id="${item.id}">
          <div class="swipe-row-leading">
            <button class="swipe-action-btn" style="background:#34C759" onclick="stockItem(${item.id})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Stock
            </button>
            <button class="swipe-action-btn" style="background:#FF9500" onclick="useItem(${item.id})" ${useDisabled}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Use
            </button>
            <button class="swipe-action-btn" style="background:#007AFF" onclick="editItemModal(${item.id})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit
            </button>
          </div>

//  SWIPE ROWS
// ══════════════════════════════════
const LEAD_W = 240, TRAIL_W = 80, SNAP_PX = 60, CLOSE_PX = 20;
let openSwipeId = null, openSwipeDir = null;
let _swipe = null;

function initSwipeRow(id) {
  const wrap = document.querySelector(`.swipe-row-wrap[data-swipe-id="${id}"]`);
  if (!wrap) return;
  const content = wrap.querySelector('.swipe-row-content');

  function getBase() {
    if (openSwipeId !== id) return 0;
    return openSwipeDir === 'leading' ? LEAD_W : -TRAIL_W;
  }

  function snapTo(offset) {
    content.style.transition = 'transform 0.22s cubic-bezier(.4,0,.2,1)';
    content.style.transform = offset ? `translateX(${offset}px)` : '';
    if (offset > 0)       { openSwipeId = id; openSwipeDir = 'leading'; }
    else if (offset < 0)  { openSwipeId = id; openSwipeDir = 'trailing'; }
    else if (openSwipeId === id) { openSwipeId = null; openSwipeDir = null; }
  }

  wrap.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // Let clicks on action buttons pass through unintercepted
    if (e.target.closest('.swipe-action-btn')) return;
    if (openSwipeId && openSwipeId !== id) closeSwipeRow(openSwipeId);
    _swipe = { id, startX: e.clientX, startY: e.clientY, base: getBase(), moved: false, cancelled: false };
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', e => {
    if (!_swipe || _swipe.id !== id || _swipe.cancelled) return;
    const dx = e.clientX - _swipe.startX;
    const dy = e.clientY - _swipe.startY;
    if (!_swipe.moved && Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 8) {
      _swipe.cancelled = true; return;
    }
    _swipe.moved = true;
    let x = Math.max(-TRAIL_W, Math.min(LEAD_W, _swipe.base + dx));
    content.style.transition = 'none';
    content.style.transform = x ? `translateX(${x}px)` : '';
  });

  wrap.addEventListener('pointerup', e => {
    if (!_swipe || _swipe.id !== id) return;
    const dx = e.clientX - _swipe.startX;
    const { base, moved, cancelled } = _swipe;
    _swipe = null;
    if (!moved || cancelled) { if (openSwipeId === id) snapTo(0); return; }
    const total = base + dx;
    if (base === 0) {
      if (total > SNAP_PX) snapTo(LEAD_W);
      else if (total < -SNAP_PX) snapTo(-TRAIL_W);
      else snapTo(0);
    } else if (base > 0) {
      snapTo(dx < -CLOSE_PX ? 0 : LEAD_W);
    } else {
      snapTo(dx > CLOSE_PX ? 0 : -TRAIL_W);
    }
  });

  wrap.addEventListener('pointercancel', () => {
    if (_swipe && _swipe.id === id) { _swipe = null; snapTo(getBase()); }
  });
}

function closeSwipeRow(id) {
  const wrap = document.querySelector(`.swipe-row-wrap[data-swipe-id="${id}"]`);
  if (!wrap) return;
  const content = wrap.querySelector('.swipe-row-content');
  if (content) { content.style.transition = 'transform 0.22s cubic-bezier(.4,0,.2,1)'; content.style.transform = ''; }
  if (openSwipeId === id) { openSwipeId = null; openSwipeDir = null; }
}

// Close open row when tapping outside it
document.addEventListener('pointerdown', e => {
  if (openSwipeId == null) return;
  const wrap = document.querySelector(`.swipe-row-wrap[data-swipe-id="${openSwipeId}"]`);
  if (wrap && !wrap.contains(e.target)) closeSwipeRow(openSwipeId);
});

function stockItem(id) {
  const item = S.inventory.find(x => x.id === id);
  if (!item) return;
  item.qty++;
  openSwipeId = null; openSwipeDir = null;
  renderFridge();
  showToast(`${item.name}: ${item.qty}`);
}

function useItem(id) {
  const item = S.inventory.find(x => x.id === id);
  if (!item || item.qty <= 0) return;
  item.qty--;
  openSwipeId = null; openSwipeDir = null;
  renderFridge();
  showToast(`${item.name}: ${item.qty}`);
}

function editItemModal(id) {
  const item = S.inventory.find(x => x.id === id);
  if (!item) return;
  if (openSwipeId) closeSwipeRow(openSwipeId);
  S._editingItemId = id;
  document.getElementById('modal-add-title').textContent = 'Edit Item';
  document.getElementById('add-name').value = item.name;
  document.getElementById('add-cat').value = item.cat;
  document.getElementById('add-qty').value = item.qty;
  document.getElementById('modal-save-btn').textContent = 'Save Changes';
  document.getElementById('modal-add').classList.add('open');
  setTimeout(() => document.getElementById('add-name').focus({ preventScroll: true }), 50);
}

function backFromDetail() {
  goScreen('s-main');
  setFlow('fi-plan');
}

function addMissingToShop(recipeId) {
  const r = RECIPES.find(x=>x.id===recipeId);
  if (!r) return;
  let added = 0;
  r.buy.forEach(item => {
    if (!S.shopping.find(s=>s.name===item.name)) {
      S.shopping.push({...item, purchased:false, id:Date.now()+Math.random()});
      added++;
    }
  });
  renderShop();
  backFromDetail();
  setTimeout(() => {
    goTab(2);
    showToast(added > 0 ? `${added} item${added>1?'s':''} added to shopping list` : 'Items already in list');
    setFlow('fi-shop');
  }, 250);
}

      </div>`;
    });
    h += `</div>`;
  });
  h += `</div>`;
  el.innerHTML = h;
}

function togglePurchased(id) {
  const item = S.shopping.find(i=>i.id===id);
  if (item) { item.purchased = !item.purchased; renderShop(); }
}

function clearBoughtConfirm() {
  // Matches iOS confirmationDialog before destructive clear
  if (confirm('Remove all purchased items from the list?\n\nThis cannot be undone.')) {
    S.shopping = S.shopping.filter(i=>!i.purchased);
    renderShop();
    showToast('Bought items cleared');
  }
}

function shareShoppingList() {
  // Matches iOS ShareLink — builds share text then opens native share sheet (or alerts in browser)
  const lines = ['Shopping List'];
  const totalAll = S.shopping.reduce((s,i)=>s+(i.cost||0),0);
  if (totalAll > 0) lines.push('Total: HK$' + totalAll);
  lines.push('');
  const groups = {};
  S.shopping.forEach(i => (groups[i.recipe]=groups[i.recipe]||[]).push(i));
  Object.keys(groups).sort().forEach(recipe => {
    lines.push(recipe + ':');
    groups[recipe].forEach(item => {
      const status = item.purchased ? '✓' : '○';
      let row = `${status} ${item.name} – ${item.qty} ${item.unit}`;
      if (item.cost != null) row += ` (HK$${item.cost})`;
      lines.push(row);
    });
    lines.push('');
  });
  const text = lines.join('\n').trim();
  if (navigator.share) {
    navigator.share({ title: 'Shopping List', text }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(text).then(() => showToast('Copied to clipboard')).catch(() => showToast('Share not supported'));
  }
}

let _pendingDeleteMemberIdx = null;

function promptDeleteMember(idx) {

function confirmDeleteMember() {
  closeSheet('sheet-delete-member');

// ══════════════════════════════════
//  TRAILING-ONLY SWIPE ROWS (members)
// ══════════════════════════════════
function initTrailingOnlySwipeRow(id) {
  const wrap = document.querySelector(`.swipe-row-wrap[data-swipe-id="${id}"]`);
  if (!wrap) return;
  const content = wrap.querySelector('.swipe-row-content');

  function getBase() { return (openSwipeId === id && openSwipeDir === 'trailing') ? -TRAIL_W : 0; }
  function snapTo(offset) {
    content.style.transition = 'transform 0.22s cubic-bezier(.4,0,.2,1)';
    content.style.transform = offset ? `translateX(${offset}px)` : '';
    if (offset < 0)          { openSwipeId = id; openSwipeDir = 'trailing'; }
    else if (openSwipeId === id) { openSwipeId = null; openSwipeDir = null; }
  }

  wrap.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('.swipe-action-btn')) return;
    if (openSwipeId && openSwipeId !== id) closeSwipeRow(openSwipeId);
    _swipe = { id, startX: e.clientX, startY: e.clientY, base: getBase(), moved: false, cancelled: false };
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', e => {
    if (!_swipe || _swipe.id !== id || _swipe.cancelled) return;
    const dx = e.clientX - _swipe.startX, dy = e.clientY - _swipe.startY;
    if (!_swipe.moved && Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 8) { _swipe.cancelled = true; return; }
    _swipe.moved = true;
    const x = Math.max(-TRAIL_W, Math.min(0, _swipe.base + dx));
    content.style.transition = 'none';
    content.style.transform = x ? `translateX(${x}px)` : '';
  });

  wrap.addEventListener('pointerup', e => {
    if (!_swipe || _swipe.id !== id) return;
    const dx = e.clientX - _swipe.startX;
    const { base, moved, cancelled } = _swipe;
    _swipe = null;
    if (!moved || cancelled) { if (openSwipeId === id) snapTo(0); return; }
    const total = base + dx;
    if (base === 0) snapTo(total < -SNAP_PX ? -TRAIL_W : 0);
    else snapTo(dx > CLOSE_PX ? 0 : -TRAIL_W);
  });

  wrap.addEventListener('pointercancel', () => {
    if (_swipe && _swipe.id === id) { _swipe = null; snapTo(getBase()); }
  });
}
