    url: https://github.com/supabase-community/supabase-swift
    majorVersion: "2.0.0"

targets:
  SmartFridge:
    type: application
    platform: iOS
    sources:
      - SmartFridge
    info:
      path: SmartFridge/Info.plist
      properties:
        NSCameraUsageDescription: SmartFridge uses the camera to scan your fridge contents.
        NSPhotoLibraryUsageDescription: SmartFridge reads photos from your library to detect fridge contents.
        SUPABASE_URL: https://dpgxcyktcptsnihpitjr.supabase.co
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        API_BASE_URL: http://152.42.221.192:8000
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSExceptionDomains:
            152.42.221.192:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartfridge.app
        SWIFT_VERSION: "5.9"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwZ3hjeWt0Y3B0c25paHBpdGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MjA3OTMsImV4cCI6MjA4OTI5Njc5M30.e9TOBfXerlt9DJreTNHdxDEiTyWsU-BTbZC0gqAl1RU"
    dependencies:
      - package: Supabase
        product: Supabase

  SmartFridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartFridgeTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: SmartFridge
